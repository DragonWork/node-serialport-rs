name: Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      prebuilt:
        description: Test release artifacts from the calling workflow
        type: boolean
        default: false
      release-commit:
        description: Prepared release commit to test
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.1
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    if: '!inputs.prebuilt'
    name: Dev build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-latest, target: aarch64-apple-darwin}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - run: npm ci --ignore-scripts
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev-${{ matrix.target }}
          cache-bin: false
      - run: npm run build:debug
      - name: Build pseudo-terminal helper
        if: runner.os != 'Windows'
        run: cargo build --locked --example pty
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-native-${{ matrix.target }}
          path: |
            native/
            target/debug/examples/pty
          if-no-files-found: error

  test:
    needs: build
    if: ${{ !cancelled() && (inputs.prebuilt || needs.build.result == 'success') }}
    name: Test ${{ matrix.target }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: 20}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: 22}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: 24}
          - {runner: ubuntu-26.04, target: x86_64-unknown-linux-gnu, node: 26}
          - {runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, node: 26}
          - {runner: macos-latest, target: aarch64-apple-darwin, node: 26}
          - {runner: windows-latest, target: x86_64-pc-windows-msvc, node: 26}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.prebuilt
        with:
          name: release-source
          path: artifacts/
      - name: Apply prepared release files
        if: inputs.prebuilt
        run: node scripts/prepare-release.js --apply artifacts/prepared-release.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: (inputs.prebuilt && runner.os != 'Windows') || (matrix.target == 'x86_64-unknown-linux-gnu' && matrix.node == 26)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: ${{ !inputs.prebuilt && matrix.target == 'x86_64-unknown-linux-gnu' && matrix.node == 26 }}
        with:
          shared-key: dev-${{ matrix.target }}
          cache-bin: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.prebuilt && 'native-' || 'dev-native-' }}${{ matrix.target }}
          path: ${{ inputs.prebuilt && 'native/' || '.' }}
      - name: Restore helper executable permission
        if: ${{ !inputs.prebuilt && runner.os != 'Windows' }}
        run: chmod +x target/debug/examples/pty
      - name: Validate package and addon loading
        run: |
          npm ci --ignore-scripts
          npm run build:js
          node scripts/check-package.js
      - name: Build pseudo-terminal helper
        if: inputs.prebuilt && runner.os != 'Windows'
        run: cargo build --locked --example pty
      - name: Test Unix transport
        if: runner.os != 'Windows'
        run: npm test
      - name: Test portable API on Windows
        if: runner.os == 'Windows'
        run: node --test test/build.test.js test/bytes.test.js test/compatibility.test.js test/exports.test.js test/lifecycle.test.js test/mock.test.js test/native.test.js test/parsers.test.js test/release.test.js
      - name: Check Rust
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.node == 26
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked --lib
      - name: Check SerialPort 13 compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.node == 26
        run: |
          npm install --no-save --ignore-scripts --package-lock=false serialport@13.0.0
          node scripts/compare-parsers.js node_modules/serialport
          SERIALPORT_REFERENCE_STREAM="$PWD/node_modules/@serialport/stream" node --expose-gc --test test/compatibility.test.js test/consumer.test.js
      - name: Check formatting and TypeScript API
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.node == 26
        run: |
          npm run format:check
          npm run check:types
