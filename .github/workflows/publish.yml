name: Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.98.1
  CARGO_INCREMENTAL: '0'

jobs:
  targets:
    if: github.repository == 'DragonWork/node-serialport-rs'
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - id: matrix
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({include: require('./lib/targets.json')}) + '\n')"

  prebuild:
    needs: targets
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || contains(matrix.target, 'msvc') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install cross compiler
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Configure Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          : "${ANDROID_NDK_LATEST_HOME:?Android NDK is missing from the runner}"
          serial_ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$serial_ndk_bin/aarch64-linux-android21-clang"
          test -x "$serial_ndk_bin/armv7a-linux-androideabi21-clang"
          test -x "$serial_ndk_bin/x86_64-linux-android21-clang"
          test -x "$serial_ndk_bin/i686-linux-android21-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$serial_ndk_bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$serial_ndk_bin/armv7a-linux-androideabi21-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$serial_ndk_bin/x86_64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$serial_ndk_bin/i686-linux-android21-clang" >> "$GITHUB_ENV"
      - name: Cross-compile
        if: matrix.cross
        run: cross build --release --locked --lib --target ${{ matrix.target }}
      - name: Compile with the platform SDK
        if: '!matrix.cross'
        run: cargo build --release --locked --lib --target ${{ matrix.target }}
      - name: Stage native addon
        run: node scripts/stage-native.js ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native/
          if-no-files-found: error

  verify:
    needs: prebuild
    uses: ./.github/workflows/test.yml
    with:
      prebuilt: true

  package:
    needs: [prebuild, verify]
    runs-on: ubuntu-26.04
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      npm-tag: ${{ steps.pack.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: native/
      - name: Require the complete native matrix
        run: |
          npm ci --ignore-scripts
          npm run build:js
          node scripts/check-package.js --prebuilds
      - id: pack
        name: Pack the npm artifact
        run: |
          npm pack
          node -e "const p = require('./package.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tarball=serialport-rs-' + p.version + '.tgz\nnpm-tag=' + (p.version.includes('-') ? 'next' : 'latest') + '\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.repository == 'DragonWork/node-serialport-rs'
    needs: package
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
      - name: Publish with OIDC and provenance
        env:
          PACKAGE_FILE: ${{ needs.package.outputs.tarball }}
          NPM_TAG: ${{ needs.package.outputs.npm-tag }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --tag "$NPM_TAG"
