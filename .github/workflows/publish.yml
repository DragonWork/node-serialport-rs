name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: auto, patch, minor, major, or an exact version such as 0.2.0
        type: string
        default: auto
      publish:
        description: Publish npm and GitHub releases after all checks succeed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

env:
  RUST_VERSION: stable
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: '0'

jobs:
  targets:
    if: github.repository == 'DragonWork/node-serialport-rs' && github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Set up checksum-pinned tool installation
        uses: DragonWork/install-action@c02040044a4995c2c4a855c48a9c3278d7d713ba # v1.0.3
      - name: Install git-cliff
        uses: DragonWork/install-action/tools/git-cliff@7b03d4b6428472552f85b3df46fa8c175b8337fa # v2.14.2
      - name: Check release preparation
        env:
          GIT_CLIFF: git-cliff
        run: |
          npm ci --ignore-scripts
          npm run build:js
          npm run build:tests
          node --enable-source-maps --test test/release-preparation.test.js
      - name: Prepare version and changelog
        id: prepare
        env:
          GIT_CLIFF: git-cliff
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: npm run release:prepare -- "$RELEASE_VERSION" artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: artifacts/prepared-release.json
          if-no-files-found: error
      - id: matrix
        run: |
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({include: require('./lib/targets.json')}) + '\n')"

  prebuild:
    needs: targets
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || contains(matrix.target, 'msvc') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: artifacts/
      - name: Apply prepared release files
        run: node scripts/prepare-release.js --apply artifacts/prepared-release.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install cross compiler
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Configure Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          : "${ANDROID_NDK_LATEST_HOME:?Android NDK is missing from the runner}"
          serial_ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$serial_ndk_bin/aarch64-linux-android21-clang"
          test -x "$serial_ndk_bin/armv7a-linux-androideabi21-clang"
          test -x "$serial_ndk_bin/x86_64-linux-android21-clang"
          test -x "$serial_ndk_bin/i686-linux-android21-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$serial_ndk_bin/aarch64-linux-android21-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$serial_ndk_bin/armv7a-linux-androideabi21-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$serial_ndk_bin/x86_64-linux-android21-clang"
            echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$serial_ndk_bin/i686-linux-android21-clang"
          } >> "$GITHUB_ENV"
      - name: Cross-compile
        if: matrix.cross
        run: cross build --release --locked --lib --target ${{ matrix.target }}
      - name: Compile with the platform SDK
        if: '!matrix.cross'
        run: cargo build --release --locked --lib --target ${{ matrix.target }}
      - name: Stage native addon
        run: node scripts/stage-native.js ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: native/
          if-no-files-found: error

  verify:
    needs: [targets, prebuild]
    uses: ./.github/workflows/test.yml
    with:
      prebuilt: true
      release-commit: ${{ needs.targets.outputs.commit }}

  package:
    needs: [targets, prebuild, verify]
    runs-on: ubuntu-26.04
    env:
      RELEASE_COMMIT: ${{ needs.targets.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: artifacts/
      - name: Apply prepared release files
        run: node scripts/prepare-release.js --apply artifacts/prepared-release.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: native/
      - run: npm ci --ignore-scripts
      - name: Validate and pack the complete release archive
        run: npm run pack:release -- artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.repository == 'DragonWork/node-serialport-rs'
    needs: [targets, package]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.targets.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: artifacts/
      - name: Publish the verified archive with OIDC and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.js artifacts/release.json
